<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Zone Planner · HR Hub by Mia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Jost:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* HR Hub by Mia — shared styles. Change the brand color in one place: --accent. */
:root{
  --bg:#16171A; --panel:#1F2124; --line:#33363B; --ink:#ECE8E1; --muted:#A39F97; --soft:#2A2D31;
  --accent:#D9A24E; --accent-ink:#1B1408; --accent-soft:#3A2F1C; --danger:#F08A80; --warn:#E3B55A; --desk:#0F1012;
  color-scheme:dark;
  --f-display:"Bodoni Moda", "Didot", Georgia, serif;
  --f-body:"Jost", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
[hidden]{display:none!important}
img{max-width:100%}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* top bar */
.hub-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hub-brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.hub-brand img{height:38px;width:auto}
.hub-brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em}
.hub-brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.hub-crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.hub-crumb strong{color:var(--ink);font-weight:600}
.hub-top .grow{flex:1}
.hub-private{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hub-private::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px;margin-bottom:18px}
.page-head h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,34px);line-height:1.1;margin:0;text-wrap:balance}
.page-head p{margin:0;color:var(--muted);max-width:62ch}
.replaces{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 10px;background:var(--panel)}
.cols{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.cols.wide-left{grid-template-columns:400px minmax(0,1fr)}
@media (max-width:860px){.cols,.cols.wide-left{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 12px}
.panel + .panel{margin-top:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.grid2,.grid3{grid-template-columns:1fr}}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:13px}
hr.sep{border:0;border-top:1px solid var(--line);margin:4px 0}

/* form controls */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=email],.field input[type=url],.field input[type=tel],.field input[type=date],.field input[type=time],
.field select,.field textarea,.input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.field textarea{min-height:90px;resize:vertical}
.field input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;line-height:1.2;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:7px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}

/* drop zone */
.drop{border:2px dashed var(--line);border-radius:var(--r);background:var(--panel);padding:28px 18px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop strong{display:block;font-size:16px;margin-bottom:2px}
.drop .muted{font-size:13px}

/* file list */
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.files li{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:7px 10px;background:var(--panel);min-width:0}
.files li .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files li .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* stage for page previews */
.stage{scrollbar-gutter:stable;background:var(--desk);border-radius:var(--r);padding:20px;overflow:auto;min-height:360px;display:flex;flex-direction:column;align-items:center;gap:20px}
.sheet{position:relative;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.10);flex:none}
.sheet canvas{display:block}
.empty-note{color:var(--muted);text-align:center;margin:auto;max-width:40ch}

.progress{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0;font-size:13.5px}
.note.warn{border-color:var(--warn);background:#3A3020}
table.data{border-collapse:collapse;width:100%;font-size:13.5px}
table.data th,table.data td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.data th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scroll-x{overflow-x:auto}

.hub-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.hub-toast.show{opacity:1}

</style>
<style>
.grid{display:grid;grid-template-columns:200px repeat(24,minmax(34px,1fr));min-width:1020px;font-variant-numeric:tabular-nums}
.grid .zn{position:sticky;left:0;background:var(--panel);z-index:1;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;min-width:0}
.grid .zn b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .zn span{font-size:11.5px;color:var(--muted);font-family:var(--f-mono)}
.grid .zn .rm{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 4px}
.cell{border-bottom:1px solid var(--line);border-left:1px solid var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12px;cursor:pointer;padding:6px 0;line-height:1.1}
.cell small{font-size:9.5px;opacity:.75}
.cell.work{background:#25402F;color:#B4EBC6}
.cell.edge{background:#3D3420;color:#EBD49C}
.cell.night{background:#232528;color:#80838A}
.cell.best{box-shadow:inset 0 3px 0 var(--accent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;font-weight:600}
.cell.newday{border-left:2px solid #9aa0a6}
.head{font-size:11px;color:var(--muted);text-align:center;padding:4px 0;border-bottom:1px solid var(--line)}
.head.best{color:var(--accent);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.summary{font-size:15px}
.summary table{border-collapse:collapse}
.summary td{padding:4px 14px 4px 0}
.summary td:first-child{color:var(--muted)}
.summary td b{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main class="wrap">
  <div class="page-head"><h1>Time Zone Planner</h1><span class="replaces">Instead of World Time Buddy Pro</span>
    <p>See every office's hours side by side and pick a meeting time that works for everyone, including daylight saving changes.</p></div>
  <div class="panel stack">
    <div class="row between">
      <div class="row">
        <div class="field"><label for="date">Date</label><input type="date" id="date" class="input"></div>
        <div class="field"><label for="dur">Length</label><select id="dur" class="input"><option value="30">30 minutes</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select></div>
        <div class="field"><label for="addZone">Add a location</label><input list="zones" id="addZone" class="input" placeholder="Type a city, e.g. Denver"><datalist id="zones"></datalist></div>
      </div>
      <div class="field"><label for="hours">Work hours</label><div class="row"><input type="time" id="hStart" class="input" value="09:00" style="width:auto"><span>to</span><input type="time" id="hEnd" class="input" value="17:00" style="width:auto"></div></div>
    </div>
    <div class="legend"><span><i style="background:#25402F"></i>Work hours</span><span><i style="background:#3D3420"></i>Early or late</span><span><i style="background:#232528"></i>Night</span><span><i style="background:var(--accent);height:4px;vertical-align:3px"></i>Everyone is working</span></div>
    <div class="scroll-x"><div class="grid" id="grid"></div></div>
  </div>
  <div class="panel stack" id="pick" hidden>
    <h2>Selected meeting time</h2>
    <div class="summary" id="summary"></div>
    <div class="row"><button class="btn primary" id="copy">Copy for invite</button><button class="btn" id="ics">Download calendar file (.ics)</button></div>
  </div>
</main>
<script>
/* HR Hub by Mia — shared helpers used by every tool. Nothing here stores or sends data anywhere. */
(function () {
  const LIBS = {
    pdfjs: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
    pdflib: 'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js',
    fontkit: 'https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js',
    jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
    papa: 'https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js',
    xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
    diff: 'https://cdnjs.cloudflare.com/ajax/libs/jsdiff/5.1.0/diff.min.js',
    tesseract: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js',
    qrcode: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
    jsbarcode: 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js'
  };
  const PDF_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const loaded = {};

  const Hub = {
    company: { name: 'Acme Co', site: 'acmeco.com' },
    LOGO: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA2NCA2NCc+PHJlY3Qgd2lkdGg9JzY0JyBoZWlnaHQ9JzY0JyByeD0nMTQnIGZpbGw9JyMxRjIxMjQnLz48cmVjdCB4PScxMicgeT0nNTAnIHdpZHRoPSc0MCcgaGVpZ2h0PSc1JyBmaWxsPScjRDlBMjRFJy8+PHRleHQgeD0nMzInIHk9JzM4JyB0ZXh0LWFuY2hvcj0nbWlkZGxlJyBmb250LWZhbWlseT0nQXJpYWwsSGVsdmV0aWNhLHNhbnMtc2VyaWYnIGZvbnQtd2VpZ2h0PSc3MDAnIGZvbnQtc2l6ZT0nMjYnIGZpbGw9JyNmZmZmZmYnPkhSPC90ZXh0Pjwvc3ZnPg==',

    /** Load one or more libraries by key (see LIBS) or URL. Each loads once. */
    load(...keys) {
      return Promise.all(keys.map(k => {
        const url = LIBS[k] || k;
        if (!loaded[url]) loaded[url] = new Promise((res, rej) => {
          const s = document.createElement('script'); s.src = url; s.onload = res;
          s.onerror = () => rej(new Error('Could not load a required library. Check your internet connection and reload.'));
          document.head.appendChild(s);
        });
        return loaded[url];
      })).then(() => { if (window.pdfjsLib && !pdfjsLib.GlobalWorkerOptions.workerSrc) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER; });
    },

    /** Tab icon: a dark rounded square with a green bar and a short code, so HR Hub tabs never look like the Acme Co logo. */
    favicon(code) {
      const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
      x.fillStyle = '#1F2124'; x.beginPath(); x.roundRect ? x.roundRect(0, 0, 64, 64, 14) : x.rect(0, 0, 64, 64); x.fill();
      x.fillStyle = '#D9A24E'; x.fillRect(12, 50, 40, 5);
      x.fillStyle = '#FFFFFF'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = `700 ${code.length > 2 ? 21 : 28}px Arial, Helvetica, sans-serif`; x.fillText(code, 32, 29);
      document.querySelectorAll('link[rel~="icon"]').forEach(l => l.remove());
      const l = document.createElement('link'); l.rel = 'icon'; l.type = 'image/png'; l.href = c.toDataURL('image/png'); document.head.appendChild(l);
    },
    ICONS: { 'pdf-editor': 'PE', 'form-builder': 'FF', 'sign-pdf': 'SI', 'pdf-compare': 'CP', 'ocr': 'OCR', 'bates-numbering': 'BN', 'mail-merge': 'MM',
      'certificate-designer': 'CD', 'social-graphics': 'AG', 'background-remover': 'BG', 'email-signature': 'ES', 'time-zones': 'TZ', 'label-maker': 'QR', 'lock-pdf': 'LK' },

    /** Insert the shared top bar. */
    mount(title) {
      const file = (location.pathname.split('/').pop() || '').replace(/\.html$/, '');
      Hub.favicon(Hub.ICONS[file] || 'HR');
      const home = './';
      const h = document.createElement('header'); h.className = 'hub-top';
      h.innerHTML = `<a class="hub-brand" href="${home}index.html"><img src="${Hub.LOGO}" alt="HR Hub logo"><b>HR Hub</b><span>by Mia</span></a>
        ${title ? `<span class="hub-crumb">/ <strong></strong></span>` : ''}<span class="grow"></span>
        <span class="hub-private" title="Files are processed in your browser and never uploaded">Files stay on your computer</span>`;
      if (title) h.querySelector('strong').textContent = title;
      document.body.prepend(h);
      if (title) document.title = title + ' · HR Hub by Mia';
    },

    toast(msg, ms = 2800) {
      let t = document.querySelector('.hub-toast');
      if (!t) { t = document.createElement('div'); t.className = 'hub-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show'); clearTimeout(Hub._tt); Hub._tt = setTimeout(() => t.classList.remove('show'), ms);
    },

    /** Save a Blob/bytes/string as a file. */
    download(data, filename, type) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' });
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 5000);
    },

    async zip(files, zipName) {
      await Hub.load('jszip');
      const z = new JSZip(); files.forEach(f => z.file(f.name, f.data));
      Hub.download(await z.generateAsync({ type: 'blob' }), zipName);
    },

    bytes: async f => new Uint8Array(await f.arrayBuffer()),
    dataURL: f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); }),
    loadImage: src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }),
    baseName: n => (n || 'file').replace(/\.[^.]+$/, ''),
    size: b => b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB',
    esc: s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),

    /** Make an element a click-or-drop file picker. */
    dropzone(el, { accept = '', multiple = false, onFiles }) {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.multiple = multiple; inp.hidden = true;
      el.after(inp); el.tabIndex = 0; el.setAttribute('role', 'button');
      const take = list => { const fs = [...list]; if (fs.length) onFiles(multiple ? fs : [fs[0]]); };
      el.addEventListener('click', () => inp.click());
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); inp.click(); } });
      inp.addEventListener('change', () => { take(inp.files); inp.value = ''; });
      el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('over'); });
      el.addEventListener('dragleave', () => el.classList.remove('over'));
      el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('over'); take(e.dataTransfer.files); });
      return inp;
    },

    /** Open a PDF with pdf.js (keeps the original bytes intact). */
    async openPdf(bytes) {
      await Hub.load('pdfjs');
      try { return await pdfjsLib.getDocument({ data: bytes.slice(0) }).promise; }
      catch (e) { throw new Error(e && e.name === 'PasswordException' ? 'This PDF is password-protected. Remove the password first.' : 'That file could not be read as a PDF.'); }
    },

    /** Render a pdf.js page to a canvas at a given scale. */
    async renderPage(page, scale, canvas, rotation) {
      const vp = page.getViewport({ scale, rotation: rotation ?? page.rotate });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas = canvas || document.createElement('canvas');
      canvas.width = Math.floor(vp.width * dpr); canvas.height = Math.floor(vp.height * dpr);
      canvas.style.width = vp.width + 'px'; canvas.style.height = vp.height + 'px';
      const ctx = canvas.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
      return { canvas, viewport: vp };
    },

    /** Re-render without jumping: keep the page's scroll position. */
    async keepScroll(fn) { const y = window.scrollY, h = document.documentElement.scrollHeight || 1; await fn(); window.scrollTo(0, y * (document.documentElement.scrollHeight / h)); },

    hexRgb(h) { const n = parseInt((h || '#000000').slice(1), 16); return PDFLib.rgb(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255); },

    /** Make text safe for standard PDF fonts. */
    winAnsi: s => String(s || '').normalize('NFKC').replace(/₱/g, 'PHP ')
      .replace(/[^\n\x20-\x7E\xA0-\xFF‘’“”–—•€…]/g, '?'),

    /** Read a CSV or Excel file (or pasted CSV text) into { headers, rows:[{col:value}] }. */
    async readTable(fileOrText) {
      let rows;
      if (typeof fileOrText === 'string' || /\.(csv|txt|tsv)$/i.test(fileOrText.name)) {
        await Hub.load('papa');
        const text = typeof fileOrText === 'string' ? fileOrText : await fileOrText.text();
        rows = Papa.parse(text.trim(), { header: true, skipEmptyLines: true, transformHeader: h => h.trim() }).data;
      } else {
        await Hub.load('xlsx');
        const wb = XLSX.read(await fileOrText.arrayBuffer(), { type: 'array', cellDates: true });
        rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: false });
      }
      rows = rows.filter(r => Object.values(r).some(v => String(v).trim()));
      const headers = rows.length ? Object.keys(rows[0]).filter(h => h && !/^__EMPTY/.test(h)) : [];
      return { headers, rows };
    },

    /** Wrap text into lines that fit a width with a pdf-lib font. */
    wrap(text, font, size, maxW) {
      const out = [];
      String(text).split('\n').forEach(par => {
        if (!par.trim()) { out.push(''); return; }
        let line = '';
        par.split(/(\s+)/).forEach(tok => {
          const test = line + tok;
          if (font.widthOfTextAtSize(test.trimEnd(), size) <= maxW || !line.trim()) line = test;
          else { out.push(line.trimEnd()); line = tok.trimStart(); }
        });
        out.push(line.trimEnd());
      });
      return out;
    },

    /** Make a small working state for a tool when there is nothing loaded yet. */
    async samplePdf(lines, title) {
      await Hub.load('pdflib');
      const { PDFDocument, StandardFonts, rgb } = PDFLib;
      const d = await PDFDocument.create(), f = await d.embedFont(StandardFonts.Helvetica), fb = await d.embedFont(StandardFonts.HelveticaBold);
      const p = d.addPage([612, 792]);
      p.drawText(title, { x: 72, y: 700, size: 20, font: fb, color: rgb(.12, .13, .15) });
      lines.forEach((l, i) => p.drawText(l, { x: 72, y: 660 - i * 22, size: 11, font: f, color: rgb(.12, .13, .15) }));
      return await d.save();
    }
  };
  window.Hub = Hub;
})();

</script>

  var isOwner = function () { try { return localStorage.getItem(KEY + ':owner') === '1'; } catch (e) { return false; } };

    '.pv-card{background:#1F2124;color:#ECE8E1;border:1px solid #3a3d42;border-radius:12px;max-width:440px;width:100%;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);font-family:Jost,system-ui,sans-serif}' +
    '.pv-card h2{font-family:"Bodoni Moda",Georgia,serif;font-size:26px;margin:0 0 8px;line-height:1.15}' +
    '.pv-card p{margin:0 0 12px;color:#C9C4BA;line-height:1.5;font-size:15px}' +
    '.pv-mail{display:flex;gap:8px;align-items:center;background:#16171A;border:1px solid #33363B;border-radius:8px;padding:10px 12px;margin:6px 0 14px;font:500 15px "IBM Plex Mono",ui-monospace,monospace;color:#FFE1A3;word-break:break-all;user-select:all}' +
    '.pv-row{display:flex;flex-wrap:wrap;gap:8px}' +
    '.pv-btn{border:1px solid #3a3d42;background:transparent;color:#ECE8E1;border-radius:6px;padding:9px 14px;font:500 14px Jost,system-ui,sans-serif;cursor:pointer;text-decoration:none}' +
    '.pv-btn.main{background:#D9A24E;border-color:#D9A24E;color:#1B1408;font-weight:600}' +
    '.pv-btn:focus-visible{outline:2px solid #D9A24E;outline-offset:2px}';
  document.head.appendChild(css);

  var bar = document.createElement('div'); bar.className = 'pv-bar'; bar.setAttribute('role', 'note');
  function updateBar() {
    if (isOwner()) { bar.innerHTML = '<span><b>Owner mode</b> · unlimited downloads in this browser</span>'; return; }
    if (tool === 'index') { bar.innerHTML = '<span>Portfolio preview by Mia · each tool includes <b>' + FREE_USES + ' free download</b>. For full access, contact <a href="mailto:' + OWNER_EMAIL + '">' + OWNER_EMAIL + '</a></span>'; return; }
    var n = left();

      ? '<span>Portfolio preview · <b>' + n + ' free download' + (n > 1 ? 's' : '') + '</b> left for this tool</span>'

  }
  document.addEventListener('DOMContentLoaded', function () { document.body.prepend(bar); updateBar(); });
  if (document.body) { document.body.prepend(bar); updateBar(); }

  var lastBlock = 0;
  function showBlock() {
    lastBlock = Date.now();
    if (document.querySelector('.pv-back')) return;
    var subject = encodeURIComponent('Full access to HR Hub (' + toolName + ')');
    var back = document.createElement('div'); back.className = 'pv-back'; back.setAttribute('role', 'dialog'); back.setAttribute('aria-modal', 'true');
    back.innerHTML = '<div class="pv-card"><h2>Free try used</h2>' +
      '<p>You\'ve used your free download of <b></b>. This toolkit is a portfolio project by Mia: everything runs in your browser and nothing is uploaded.</p>' +
      '<p>For unlimited use, contact the owner:</p><div class="pv-mail">' + OWNER_EMAIL + '</div>' +
      '<p>Or hire Mia to build tools like this for your business.</p>' +
      '<div class="pv-row"><a class="pv-btn main" href="mailto:' + OWNER_EMAIL + '?subject=' + subject + '">Email Mia</a>' +
      '<button class="pv-btn" data-copy>Copy email</button><button class="pv-btn" data-close>Close</button></div></div>';
    back.querySelector('b').textContent = toolName;
    back.addEventListener('click', function (e) {

        var t = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(OWNER_EMAIL) : Promise.reject()).then(function () { t.textContent = 'Copied'; }, function () {
          var r = document.createRange(); r.selectNodeContents(back.querySelector('.pv-mail')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Press Ctrl+C';
        });

    document.body.appendChild(back); back.querySelector('.pv-btn.main').focus();
  }
  function allow() {
    if (isOwner()) return true;
    if (left() <= 0) { showBlock(); return false; }
    var d = read(); d[tool] = (d[tool] || 0) + 1; write(d); setTimeout(updateBar, 0);
    return true;
  }
  // Every file a tool saves goes through a download link click.
  var origClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    if (this.hasAttribute('download') && !allow()) return;
    return origClick.apply(this, arguments);
  };
  // The email signature tool hands over its result by copying, so count that too.
  if (tool === 'email-signature' && navigator.clipboard) {
    var w = navigator.clipboard.write && navigator.clipboard.write.bind(navigator.clipboard);
    var wt = navigator.clipboard.writeText && navigator.clipboard.writeText.bind(navigator.clipboard);
    if (w) navigator.clipboard.write = function (x) { return allow() ? w(x) : Promise.resolve(); };
    if (wt) navigator.clipboard.writeText = function (x) { return allow() ? wt(x) : Promise.resolve(); };
  }
  // Don't show "Downloaded" messages right after a blocked download.
  if (window.Hub && Hub.toast) { var t0 = Hub.toast; Hub.toast = function () { if (Date.now() - lastBlock < 1500) return; return t0.apply(Hub, arguments); }; }
})();
</script>
<script>
Hub.mount('Time Zone Planner');
const $ = id => document.getElementById(id);
const all = (Intl.supportedValuesOf ? Intl.supportedValuesOf('timeZone') : ['America/Chicago', 'America/New_York', 'America/Denver', 'America/Los_Angeles', 'America/Phoenix', 'Asia/Manila', 'Europe/London', 'UTC']);
$('zones').innerHTML = all.map(z => `<option value="${z.split('/').pop().replace(/_/g, ' ')} — ${z}">`).join('');
let zones = ['America/Chicago', 'America/New_York', 'America/Los_Angeles', 'Asia/Manila'];
const save = () => {};
let sel = null;
const t0 = new Date(); $('date').value = `${t0.getFullYear()}-${String(t0.getMonth() + 1).padStart(2, '0')}-${String(t0.getDate()).padStart(2, '0')}`;

function parts(ms, tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short' }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour % 24, mi: +p.minute, wd: p.weekday };
}
function zonedToUtc(y, mo, d, h, mi, tz) {
  let guess = Date.UTC(y, mo - 1, d, h, mi);
  for (let i = 0; i < 2; i++) { const p = parts(guess, tz), asUtc = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi); guess += Date.UTC(y, mo - 1, d, h, mi) - asUtc; }
  return guess;
}
const label = tz => tz.split('/').pop().replace(/_/g, ' ');
const abbr = (ms, tz) => (new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'short' }).formatToParts(new Date(ms)).find(x => x.type === 'timeZoneName') || {}).value || '';
const fmtTime = (ms, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, hour: 'numeric', minute: '2-digit' }).format(new Date(ms));
const fmtDay = (ms, tz) => new Intl.DateTimeFormat('en-US', { timeZone: tz, weekday: 'short', month: 'short', day: 'numeric' }).format(new Date(ms));
const hm = s => { const [h, m] = s.split(':').map(Number); return h + m / 60; };

function render() {
  const [y, mo, d] = $('date').value.split('-').map(Number), ref = zones[0];
  const ws = hm($('hStart').value), we = hm($('hEnd').value), dur = +$('dur').value / 60;
  const cols = [...Array(24)].map((_, h) => zonedToUtc(y, mo, d, h, 0, ref));
  const status = (ms, tz) => { const p = parts(ms, tz), h = p.h + p.mi / 60; return h >= ws && h + dur <= we + 1e-9 ? 'work' : (h >= 7 && h < 21) ? 'edge' : 'night'; };
  const best = cols.map(ms => zones.every(z => status(ms, z) === 'work'));
  let html = `<div class="zn" style="border-bottom:1px solid var(--line)"><span>Hours in ${label(ref)}</span></div>` + cols.map((ms, i) => `<div class="head${best[i] ? ' best' : ''}">${best[i] ? '★' : ''}</div>`).join('');
  zones.forEach((z, zi) => {
    const now = Date.now();
    html += `<div class="zn"><b>${label(z)}</b><span>${abbr(cols[12], z)} · now ${fmtTime(now, z)}</span>${zones.length > 1 ? `<button class="rm" data-z="${zi}" aria-label="Remove ${label(z)}">✕</button>` : ''}</div>`;
    let prevDay = null;
    cols.forEach((ms, i) => {
      const p = parts(ms, z), h12 = (p.h % 12) || 12, ap = p.h < 12 ? 'am' : 'pm', newday = prevDay !== null && p.d !== prevDay; prevDay = p.d;
      html += `<div class="cell ${status(ms, z)}${best[i] ? ' best' : ''}${sel === ms ? ' sel' : ''}${newday ? ' newday' : ''}" data-ms="${ms}" title="${fmtDay(ms, z)} ${fmtTime(ms, z)}">${h12}${p.mi ? ':' + String(p.mi).padStart(2, '0') : ''}<small>${newday || i === 0 ? p.wd : ap}</small></div>`;
    });
  });
  $('grid').innerHTML = html;
  if (sel && !cols.includes(sel)) { sel = null; }
  summary();
}
function summary() {
  $('pick').hidden = !sel; if (!sel) return;
  const end = sel + (+$('dur').value) * 60000;
  $('summary').innerHTML = '<table>' + zones.map(z => `<tr><td>${label(z)}</td><td><b>${fmtDay(sel, z)}, ${fmtTime(sel, z)} – ${fmtTime(end, z)}</b> ${abbr(sel, z)}</td></tr>`).join('') + '</table>';
}
$('grid').onclick = e => {
  const rm = e.target.closest('.rm'); if (rm) { zones.splice(+rm.dataset.z, 1); save(); render(); return; }
  const c = e.target.closest('.cell'); if (!c) return; sel = +c.dataset.ms; render();
};
$('addZone').addEventListener('change', e => {
  const val = e.target.value, tz = (val.split(' — ')[1] || all.find(z => z.toLowerCase().includes(val.toLowerCase().replace(/ /g, '_'))) || '').trim();
  if (!tz || !all.includes(tz)) { Hub.toast('Pick a location from the list.'); return; }
  if (!zones.includes(tz)) zones.push(tz); save(); e.target.value = ''; render();
});
['date', 'dur', 'hStart', 'hEnd'].forEach(id => $(id).addEventListener('change', render));
$('copy').onclick = async () => {
  const end = sel + (+$('dur').value) * 60000;
  const txt = 'Meeting time:\n' + zones.map(z => `${label(z)}: ${fmtDay(sel, z)}, ${fmtTime(sel, z)} – ${fmtTime(end, z)} ${abbr(sel, z)}`).join('\n');
  try { await navigator.clipboard.writeText(txt); Hub.toast('Copied. Paste it into your invite or chat.'); } catch (e) { Hub.toast('Could not copy automatically.'); }
};
$('ics').onclick = () => {
  const end = sel + (+$('dur').value) * 60000, f = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const desc = zones.map(z => `${label(z)}: ${fmtTime(sel, z)} ${abbr(sel, z)}`).join('\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Acme Co//HR Hub//EN', 'BEGIN:VEVENT', `UID:${sel}@hrhub`, `DTSTAMP:${f(Date.now())}`, `DTSTART:${f(sel)}`, `DTEND:${f(end)}`, 'SUMMARY:Team meeting', `DESCRIPTION:${desc}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  Hub.download(ics, 'meeting.ics', 'text/calendar');
};
render();
</script>
